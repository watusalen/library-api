# Development Profile Configuration (PostgreSQL - local docker)
spring.application.name=library-api-dev

# Datasource (PostgreSQL - docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:library_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:library_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (RNF04, RNF07)
jwt.secret=${JWT_SECRET:change-this-secret-in-a-real-environment-please-minimum-32-bytes}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}